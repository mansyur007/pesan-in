<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Profil - Pesanin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-header { background: var(--green); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .page-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .profile-hero { background: linear-gradient(135deg, var(--green), var(--green-dark)); padding: 28px 20px 24px; text-align: center; color: white; }
    .avatar-big { font-size: 72px; line-height: 1; margin-bottom: 10px; }
    .role-badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 6px; }
    .section-card { background: white; border-radius: 14px; margin: 12px 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .menu-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; text-decoration: none; color: inherit; }
    .menu-row:last-child { border-bottom: none; }
    .menu-row .icon { font-size: 22px; margin-right: 14px; }
    .menu-row .label { flex: 1; font-size: 14px; font-weight: 500; }
    .menu-row .arrow { color: #ccc; font-size: 16px; }
    .avatar-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .avatar-opt { font-size: 28px; cursor: pointer; padding: 6px; border-radius: 10px; border: 2px solid transparent; }
    .avatar-opt.selected { border-color: var(--green); background: var(--green-light); }
    body { padding-bottom: 40px; }
  </style>
</head>
<body>
  <div class="page-header">
    <button onclick="history.back()">←</button>
    <span style="font-size:16px;font-weight:700;">Profil Saya</span>
  </div>
  <div id="profileContent">
    <div class="loader"><div class="spinner"></div></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
