<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Riwayat Pesanan - Pesanin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-header { background: var(--green); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .page-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .order-card { background: white; border-radius: 14px; margin: 10px 16px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    body { background: var(--bg); padding-bottom: 40px; }
  </style>
</head>
<body>
  <div class="page-header">
    <button onclick="history.back()">←</button>
    <span style="font-size:16px;font-weight:700;">Riwayat Pesanan</span>
  </div>
  <div id="historyContent">
    <div class="loader"><div class="spinner"></div></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/order-history.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
