<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Dompet - Pesanin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-header { background: var(--green); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .page-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .wallet-hero { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); padding: 28px 20px 24px; color: white; }
    .wallet-total-label { font-size: 12px; opacity: 0.6; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .wallet-total { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
    .wallet-sub { font-size: 12px; opacity: 0.7; margin-top: 4px; }
    .action-bar { display: flex; gap: 10px; margin-top: 20px; }
    .action-btn { flex: 1; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; padding: 10px 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
    .action-btn:active { background: rgba(255,255,255,0.2); }
    .asset-card { background: white; border-radius: 14px; margin: 12px 16px 0; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); display: flex; align-items: center; gap: 14px; }
    .asset-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .asset-info { flex: 1; }
    .asset-symbol { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .asset-name { font-size: 14px; font-weight: 700; color: #1a1a1a; }
    .asset-balance { text-align: right; }
    .asset-amount { font-size: 15px; font-weight: 800; color: #1a1a1a; }
    .asset-idr { font-size: 11px; color: #999; }
    .txn-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
    .txn-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .txn-icon.in { background: #D4EDDA; }
    .txn-icon.out { background: #F8D7DA; }
    .txn-icon.gfc { background: #FFF3CD; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: white; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; margin: 0 auto; }
    .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    body { padding-bottom: 40px; }
  </style>
</head>
<body>
  <div class="page-header">
    <button onclick="history.back()">←</button>
    <span style="font-size:16px;font-weight:700;">Dompet Digital</span>
  </div>
  <div id="walletContent">
    <div class="loader"><div class="spinner"></div></div>
  </div>

  <!-- Top Up Modal -->
  <div class="modal-overlay" id="topupModal" onclick="closeModal('topupModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">Top Up Saldo</div>
      <div class="form-group">
        <label class="form-label">Mata Uang</label>
        <select class="form-input" id="topupCurrency" onchange="updateTopupHint()">
          <option value="IDR">🇮🇩 Rupiah (IDR)</option>
          <option value="GFC">🪙 GoFood Coin (GFC)</option>
          <option value="USDT">₮ Tether (USDT)</option>
          <option value="BTC">₿ Bitcoin (BTC)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Jumlah</label>
        <input class="form-input" id="topupAmount" type="number" placeholder="0">
        <div id="topupHint" style="font-size:12px;color:#999;margin-top:4px;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Metode</label>
        <select class="form-input" id="topupMethod">
          <option>Transfer Bank</option>
          <option>QRIS</option>
          <option>Virtual Account</option>
          <option>Crypto Deposit</option>
        </select>
      </div>
      <button class="btn-primary" onclick="doTopup()">Top Up Sekarang</button>
    </div>
  </div>

  <!-- Transfer Modal -->
  <div class="modal-overlay" id="transferModal" onclick="closeModal('transferModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">Transfer Saldo</div>
      <div class="form-group">
        <label class="form-label">Mata Uang</label>
        <select class="form-input" id="transferCurrency">
          <option value="IDR">🇮🇩 Rupiah (IDR)</option>
          <option value="GFC">🪙 GoFood Coin (GFC)</option>
          <option value="USDT">₮ Tether (USDT)</option>
          <option value="BTC">₿ Bitcoin (BTC)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Email Penerima</label>
        <input class="form-input" id="transferEmail" type="email" placeholder="email@penerima.com">
      </div>
      <div class="form-group">
        <label class="form-label">Jumlah</label>
        <input class="form-input" id="transferAmount" type="number" placeholder="0">
      </div>
      <button class="btn-primary" onclick="doTransfer()">Transfer</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/wallet.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
