<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Status Pesanan - Pesanin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-header { background: var(--green); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
    .page-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0; }
    .order-card { background: white; border-radius: 14px; margin: 12px 16px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .order-item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: #555; }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; color: #555; }
    .summary-row.total { font-weight: 800; font-size: 15px; color: #1A1A1A; border-top: 1px solid #eee; margin-top: 6px; padding-top: 10px; }
  </style>
</head>
<body>
  <div class="page-header">
    <button onclick="location.href='/'">←</button>
    <span style="font-size:16px;font-weight:700;">Status Pesanan</span>
  </div>
  <div id="statusContent">
    <div class="loader"><div class="spinner"></div></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/order-status.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
