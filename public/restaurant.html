<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Restoran - Pesanin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .rest-header { position: relative; }
    .rest-header img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .rest-header .img-placeholder { width: 100%; height: 200px; background: linear-gradient(135deg,#00AA5B22,#00AA5B44); display:flex; align-items:center; justify-content:center; font-size:64px; }
    .rest-info { padding: 14px 16px 12px; background: white; }
    .back-btn { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.45); color: white; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; z-index: 10; }
    .menu-section-header { padding: 12px 16px 6px; font-size: 13px; font-weight: 700; color: #555; background: #F4F4F4; text-transform: uppercase; letter-spacing: 0.5px; }
    .menu-section { padding-bottom: 90px; }
  </style>
</head>
<body>
  <div id="restaurantContent">
    <div class="loader" style="padding:80px"><div class="spinner"></div></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/restaurant.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
